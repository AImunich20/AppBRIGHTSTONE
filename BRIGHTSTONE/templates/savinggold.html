<!DOCTYPE html>
<html lang="th">

<head>
    {% include 'exten/setting.html' %}
    <style>
        .container {
            display: flex;
            gap: 40px;
            padding: 30px;
        }

        .box {
            width: 50%;
            background: #fffbe9;
            border: 1px solid #e3d7c5;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #e3d7c5;
        }

        .form-title {
            font-size: 20px;
            color: #c89b2c;
            margin-bottom: 16px;
        }

        input {
            display: block;
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbbf97;
            font-size: 15px;
        }

        button {
            padding: 10px 18px;
            background: #c89b2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #d4af37;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            padding: 10px 8px;
            border: 1px solid #e3d7c5;
            text-align: left;
        }

        th {
            background: #efe6c8;
            color: #c89b2c;
        }

        tr:nth-child(even) {
            background: #f7f3e9;
        }
    </style>
</head>

<body>

    {% include 'exten/navbar.html' %}

    <div class="page-title">Saving Gold</div>
    <div class="container">
        <!-- กล่องซ้าย: ฟอร์มเพิ่มผู้ออมทอง -->
        <div class="box">
            <div class="form-title">เพิ่มผู้ออมทอง</div>
            <form method="POST" action="">
                {% csrf_token %}
                <input type="text" name="first_name" placeholder="ชื่อ">
                <input type="text" name="last_name" placeholder="นามสกุล">
                <input type="text" name="phone" placeholder="เบอร์โทรศัพท์">
                <button type="submit">เพิ่มข้อมูล</button>
            </form>
        </div>
        <!-- กล่องขวา: ตารางรายชื่อ -->
        <div class="box">
            <div class="form-title">รายชื่อผู้ที่ออมทอง</div>
            <table>
                <tr>
                    <th>ชื่อ</th>
                    <th>นามสกุล</th>
                    <th>เบอร์</th>
                </tr>
                {% for s in savers %}
                <tr>
                    <td>{{ s.first_name }}</td>
                    <td>{{ s.last_name }}</td>
                    <td>{{ s.phone }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

</body>

</html>
